<html lang="es">
<head>
<meta charset="utf-8">

<style>
:root{--negro:#17170F;--crema:#F0EDD9;--rojo:#B80000;--vivo:#F01414;--turq:#00B5A5;--linea:#DCD8C0;--tenue:#7A7868}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--crema);color:var(--negro);font:400 16px/1.5 Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding-bottom:52px}
h1,h2,h3,.an{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.3px}
header{background:var(--negro);padding:18px 20px;display:flex;align-items:center;gap:13px}
.marca{width:42px;height:42px;border-radius:50%;background:var(--rojo);flex:none}
h1{font-size:22px;color:var(--crema);line-height:1.05}
.sub{font-size:11px;color:var(--turq);letter-spacing:1.4px;margin-top:2px}
nav{background:var(--negro);border-top:1px solid #2C2C22;display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:#9C9A88;font:500 13px Roboto,sans-serif;padding:13px 15px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--crema);border-bottom-color:var(--vivo)}
nav button:focus-visible,.segs button:focus-visible{outline:2px solid var(--turq);outline-offset:-3px}
.segs{display:flex;border-bottom:1px solid var(--linea)}
.segs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--tenue);font:500 13px Roboto,sans-serif;padding:13px 4px;cursor:pointer}
.segs button[aria-selected=true]{color:var(--rojo);border-bottom-color:var(--rojo)}
.aviso{background:#FAEEDA;border-left:3px solid #BA7517;padding:11px 20px;font-size:12px;color:#5C3A08;line-height:1.6}
.fila{display:grid;grid-template-columns:28px 1fr 32px 32px 46px;align-items:center;gap:6px;padding:11px 20px;border-bottom:1px solid var(--linea)}
.cab{padding:14px 20px 7px}
.cab span{font-size:11px;color:var(--tenue);letter-spacing:1px}
.pn{font-family:Anton,sans-serif;font-size:16px;color:#9A9880}
.eq{font-family:Anton,sans-serif;font-size:17px}
.n{font-family:Anton,sans-serif;font-size:16px;text-align:center}
.dif{font-family:Anton,sans-serif;font-size:16px;text-align:right}
.lider .pn,.lider .eq,.lider .n,.lider .dif{color:var(--rojo)}
.nota{padding:13px 20px 4px;font-size:12px;color:var(--tenue);line-height:1.65}
.nota b{font-weight:500;color:var(--negro)}
.jorn{padding:20px 20px 5px;display:flex;align-items:baseline;justify-content:space-between}
.jorn h3{font-size:15px}
.jorn span{font-size:11px;color:var(--tenue);letter-spacing:1px}
.juego{padding:11px 20px;border-bottom:1px solid var(--linea)}
.lin{display:flex;justify-content:space-between;align-items:center;padding:2px 0;gap:10px}
.lin .t{font-family:Anton,sans-serif;font-size:18px}
.lin .s{font-family:Anton,sans-serif;font-size:18px;min-width:32px;text-align:right}
.gana .t,.gana .s{color:var(--rojo)}
.vs{font-size:11px;color:var(--tenue);letter-spacing:1px;padding:3px 0 1px}
.hora{font-size:11px;color:var(--tenue);letter-spacing:.6px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:8px;margin:12px 20px 0;padding:6px 12px;background:var(--turq);border-radius:3px}
.chip i{font-style:normal;font-size:11px;color:#04413B;letter-spacing:.6px}
.chip b{font-family:Anton,sans-serif;font-size:13px;color:#04413B;font-weight:400}
.lid{display:grid;grid-template-columns:26px 1fr 44px;align-items:center;gap:10px;padding:11px 20px;border-bottom:1px solid var(--linea)}
.lid .q{font-family:Anton,sans-serif;font-size:15px;color:#9A9880}
.lid .nm{font-family:Anton,sans-serif;font-size:16px;line-height:1.2}
.lid .cl{font-size:11px;color:var(--tenue);letter-spacing:.4px}
.lid .v{font-family:Anton,sans-serif;font-size:20px;text-align:right;color:var(--rojo)}
.lid .v small{display:block;font:400 10px Roboto,sans-serif;color:var(--tenue);letter-spacing:.6px}
.vacio{padding:34px 20px;text-align:center;color:var(--tenue);font-size:14px;line-height:1.7}
.vacio b{display:block;font-family:Anton,sans-serif;font-size:17px;color:var(--negro);margin-bottom:7px;font-weight:400}
footer{background:var(--rojo);padding:13px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
footer span{font-size:11px;color:var(--crema);letter-spacing:.5px}
footer a{font-family:Anton,sans-serif;font-size:13px;color:var(--crema);text-decoration:none;border-bottom:1px solid rgba(240,237,217,.45)}
@media(max-width:400px){.fila{grid-template-columns:24px 1fr 30px 30px 42px;padding-left:14px;padding-right:14px}
 .juego,.nota,.jorn,.vacio,.lid,.cab,.aviso{padding-left:14px;padding-right:14px}.chip{margin-left:14px}}
@media(prefers-reduced-motion:no-preference){main{animation:e .18s ease-out}@keyframes e{from{opacity:0}to{opacity:1}}}
</style>
</head>

    l.fuera.map(x=>`${esc(x.j)} (${x.ci} CI en ${x.jj} de ${x.tot})`).join(', ')+'.</p>';
